server:
  port: 8081

spring:
  application:
    name: client-service
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 1500

storage:
  service:
    url: ${STORAGE_SERVICE_URL:http://localhost:8082}

resilience4j:
  retry:
    instances:
      storage:
        max-attempts: 3
        wait-duration: 400ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exception-predicate: com.example.client.resilience.TransientStorageFailure
  circuitbreaker:
    instances:
      storage:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        record-failure-predicate: com.example.client.resilience.TransientStorageFailure
        ignore-exception-predicate: com.example.client.resilience.StorageClientError
