server:
  port: 8081

spring:
  application:
    name: client-service
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 1500
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

app:
  kafka:
    topic: client.events

storage:
  service:
    url: ${STORAGE_SERVICE_URL:http://localhost:8082}

resilience4j:
  retry:
    instances:
      storage:
        max-attempts: 3
        wait-duration: 400ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exception-predicate: com.example.client.resilience.TransientStorageFailure
  circuitbreaker:
    instances:
      storage:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        record-failure-predicate: com.example.client.resilience.TransientStorageFailure
        ignore-exception-predicate: com.example.client.resilience.StorageClientError
